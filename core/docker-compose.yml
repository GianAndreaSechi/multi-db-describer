version: '3.8'

services:
  multi-db-core:
    build:
      context: ..
      dockerfile: core/Dockerfile
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      REDIS_TTL_SECONDS: 86400
      CACHE_KEY_PREFIX: multi-db-connector
    networks:
      - multi-db-net
    volumes:
      - ../core:/app/core
    # The CMD from core/Dockerfile will keep the container running
    # You can then exec into it to run tests or interact with the core library
    # e.g., docker-compose exec core bash
    restart: always

networks:
  multi-db-net:
    external: true
