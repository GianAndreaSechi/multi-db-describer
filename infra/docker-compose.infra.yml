version: '3.8'

# Shared infrastructure — start this first:
#   docker compose -f docker-compose.infra.yml up -d
#
# API, Worker and MCP docker-compose files reference the
# 'irides-net' network as external and use REDIS_HOST=redis.

services:
  redis:
    image: redis:6-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - irides-net
    restart: always

networks:
  irides-net:
    name: irides-net

volumes:
  redis_data:
