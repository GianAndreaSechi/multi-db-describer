version: '3.8'

# Requires shared infra to be running:
#   docker compose -f ../infra/docker-compose.infra.yml up -d

services:
  multi-db-api:
    build:
      context: ..
      dockerfile: api/Dockerfile
    ports:
      - "8000:8000"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      REDIS_TTL_SECONDS: 86400
      CACHE_KEY_PREFIX: multi-db-connector
      DB_CONFIG_FILE: /app/api/.env
    networks:
      - multi-db-net
    volumes:
      - ../api:/app/api
      - ../core:/app/core
    restart: always

networks:
  multi-db-net:
    external: true
