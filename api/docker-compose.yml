version: '3.8'

# Requires shared infra to be running:
#   docker compose -f ../infra/docker-compose.infra.yml up -d

services:
  irides-api:
    build:
      context: ..
      dockerfile: api/Dockerfile
    ports:
      - "8000:8000"
    environment:
      ENV: dev
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      REDIS_TTL_SECONDS: 86400
      REDIS_SOCKET_CONNECT_TIMEOUT_SECONDS: 2
      REDIS_CACHE_SOCKET_TIMEOUT_SECONDS: 2
      CACHE_KEY_PREFIX: irides
      STORAGE_METADATA_DIR: /app/storage/metadata
      STORAGE_EXPORT_DIR: /app/storage/exports
      DB_CONFIG_FILE: /app/api/.env
      LITELLM_MODEL: ${LITELLM_MODEL:-gpt-4o-mini}
      LITELLM_API_KEY: ${LITELLM_API_KEY:-}
      LITELLM_API_BASE: ${LITELLM_API_BASE:-}
      LITELLM_TIMEOUT_SECONDS: ${LITELLM_TIMEOUT_SECONDS:-120}
      LITELLM_MAX_RETRIES: ${LITELLM_MAX_RETRIES:-2}
    networks:
      - irides-net
    volumes:
      - ../api:/app/api
      - ../core:/app/core
      - ../storage:/app/storage
    restart: always

networks:
  irides-net:
    external: true
