version: '3.8'

# Requires shared infra to be running:
#   docker compose -f ../infra/docker-compose.infra.yml up -d

services:
  multi-db-api:
    build:
      context: ..
      dockerfile: api/Dockerfile
    ports:
      - "8000:8000"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      REDIS_TTL_SECONDS: 86400
      CACHE_KEY_PREFIX: multi-db-connector
      DB_CONFIG_FILE: /app/api/.env
    networks:
      - multi-db-net
    volumes:
      - ../api:/app/api
      - ../core:/app/core
    restart: always

  multi-db-mcp:
    build:
      context: ..
      dockerfile: mcp/Dockerfile
    ports:
      - "8001:8000"
    environment:
      API_BASE_URL: http://multi-db-api:8000
    depends_on:
      - multi-db-api
    networks:
      - multi-db-net
    volumes:
      - ../mcp:/app/mcp
    restart: always

  multi-db-worker:
    build:
      context: ..
      dockerfile: worker/Dockerfile
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      REDIS_TTL_SECONDS: 86400
      CACHE_KEY_PREFIX: multi-db-connector
      SCAN_RESULTS_TTL_SECONDS: 604800
      WORKER_STREAM_BLOCK_MS: 5000
      # The worker must receive exactly the same DB configuration as the API.
      DB_CONFIG_FILE: /app/api/.env
    networks:
      - multi-db-net
    volumes:
      - ../core:/app/core
      - ../worker:/app/worker
    restart: always

networks:
  multi-db-net:
    external: true
