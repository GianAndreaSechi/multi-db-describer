version: '3.8'

# Requires shared infra to be running:
#   docker compose -f ../docker-compose.infra.yml up -d

services:
  multi-db-api:
    build:
      context: ..
      dockerfile: api/Dockerfile
    ports:
      - "8000:8000"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      REDIS_TTL_SECONDS: 86400
      CACHE_KEY_PREFIX: multi-db-connector
    networks:
      - multi-db-net
    volumes:
      - ../api:/app/api
      - ../core:/app/core
    restart: always

  multi-db-mcp:
    build:
      context: ..
      dockerfile: mcp/Dockerfile
    ports:
      - "8001:8000"
    environment:
      API_BASE_URL: http://multi-db-api:8000
    depends_on:
      - multi-db-api
    networks:
      - multi-db-net
    volumes:
      - ../mcp:/app/mcp
    restart: always

networks:
  multi-db-net:
    external: true
